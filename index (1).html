<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internship Tracker</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell"><header><div><span class="eyebrow">CAREER DASHBOARD</span><h1>Internship Tracker</h1><p>Keep your applications organized, from first submission to final decision.</p></div><button id="addBtn" class="primary">+ Add application</button></header>
<section class="stats" aria-label="Application statistics"><article><span>Total applications</span><strong id="total">0</strong></article><article><span>Applied</span><strong id="applied">0</strong></article><article><span>Interviewing</span><strong id="interviewing">0</strong></article><article><span>Offers</span><strong id="offers">0</strong></article></section>
<section class="panel"><div class="panel-head"><div><h2>Your applications</h2><p>All your opportunities in one place.</p></div><div class="filters"><input id="search" type="search" placeholder="Search company or role" aria-label="Search applications"><select id="filter" aria-label="Filter by status"><option value="All">All statuses</option><option>Saved</option><option>Applied</option><option>Interviewing</option><option>Offered</option><option>Rejected</option></select></div></div><div id="list" class="list"></div></section><footer>Saved locally on this device · Export your data regularly <button id="exportBtn" class="text-button">Export JSON</button><label class="import-label">Import JSON<input type="file" id="importFile" accept="application/json" hidden></label></footer></div>
<dialog id="modal"><form id="appForm"><div class="modal-head"><h2 id="formTitle">Add application</h2><button type="button" id="closeBtn" class="icon-btn" aria-label="Close">×</button></div><input type="hidden" id="editId"><label>Company *<input id="company" maxlength="100" required placeholder="e.g. Microsoft"></label><label>Position *<input id="position" maxlength="120" required placeholder="e.g. Software Engineering Intern"></label><div class="two"><label>Status<select id="status"><option>Saved</option><option>Applied</option><option>Interviewing</option><option>Offered</option><option>Rejected</option></select></label><label>Application date<input type="date" id="date"></label></div><label>Deadline<input type="date" id="deadline"></label><label>Application link<input type="url" id="url" placeholder="https://..."></label><label>Notes<textarea id="notes" rows="3" maxlength="1500" placeholder="Recruiter contact, interview details, next steps..."></textarea></label><button class="primary full" type="submit">Save application</button></form></dialog>
<script src="script.js"></script></body></html>
